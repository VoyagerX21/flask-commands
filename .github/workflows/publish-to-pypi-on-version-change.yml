name: Publish to PyPI on version change

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change in pyproject.toml
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          # If there's no previous commit (rare edge case), don't publish.
          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "No previous commit to diff against."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          range="${GITHUB_EVENT_BEFORE}..${GITHUB_SHA}"
          changed_files="$(git diff --name-only "$range")"

          if printf '%s\n' "$changed_files" | grep -Fxq 'pyproject.toml'; then
            echo "pyproject.toml changed"
          else
            echo "pyproject.toml not changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old_toml="$(git show "${GITHUB_EVENT_BEFORE}:pyproject.toml")"
          new_toml="$(cat pyproject.toml)"

          old_version="$(python -c 'import re,sys; t=sys.stdin.read(); m=re.search(r"(?m)^\\s*version\\s*=\\s*\\\"([^\\\"]+)\\\"\\s*$", t); print(m.group(1) if m else "")' <<< "$old_toml")"
          new_version="$(python -c 'import re,sys; t=sys.stdin.read(); m=re.search(r"(?m)^\\s*version\\s*=\\s*\\\"([^\\\"]+)\\\"\\s*$", t); print(m.group(1) if m else "")' <<< "$new_toml")"

          if [[ -z "$old_version" || -z "$new_version" ]]; then
            echo "Could not detect version in pyproject.toml"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "old=$old_version"
          echo "new=$new_version"

          if [[ "$old_version" != "$new_version" ]]; then
            echo "Version changed: $old_version -> $new_version"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        if: steps.version_check.outputs.changed == 'true'
        run: pipx install poetry==2.2.0

      - name: Install dependencies
        if: steps.version_check.outputs.changed == 'true'
        run: poetry install --no-interaction

      - name: Build
        if: steps.version_check.outputs.changed == 'true'
        run: poetry build

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.version_check.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

name: Publish to PyPI on version change

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version change in pyproject.toml
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          # Extract version from pyproject.toml in the current commit
          NEW_VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)

          # Extract version from pyproject.toml in the previous commit
          OLD_VERSION=$(git show HEAD~1:pyproject.toml | grep -m 1 '^version = ' | cut -d '"' -f 2)

          echo "Old version: $OLD_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "Version changed. Proceeding with publish."
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged. Skipping publish."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi


      - name: Set up Python
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        if: steps.version_check.outputs.changed == 'true'
        run: pipx install poetry==2.2.0

      - name: Install dependencies
        if: steps.version_check.outputs.changed == 'true'
        run: poetry install --no-interaction

      - name: Build
        if: steps.version_check.outputs.changed == 'true'
        run: poetry build

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.version_check.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

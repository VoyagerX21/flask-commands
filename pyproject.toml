[project]
name = "flask-commands"
version = "0.1.0"
description = "A set of command line tools that help you scaffold out your flask application quickly."
authors = [
    {name = "Drew Butcher"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click (>=8.3.1,<9.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
flask = "flask_commands.cli:cli"
